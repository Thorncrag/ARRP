name: Source Domain Event Acceptance

on:
  pull_request:
    types:
      - closed

concurrency:
  group: arrp-source-domain-event-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  accept:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.merged_by.type == 'User' &&
      github.event.pull_request.merged_by.login == 'Thorncrag' &&
      (
        github.event.pull_request.head.ref == 'bot/case-monitor-updates' ||
        github.event.pull_request.head.ref == 'automation/presidential-directives-monitor' ||
        github.event.pull_request.head.ref == 'bot/source-checker-report'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact accepted merge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the accepted pull request contains only watcher-owned data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_SHA}" "${HEAD_SHA}" main project-console-data
          test "$(git rev-parse HEAD)" = "${MERGE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          changed=0
          while IFS=$'\t' read -r status path extra; do
            [ -n "${status}" ] || continue
            changed=$((changed + 1))
            if [ "${status}" != "M" ] || [ -n "${extra:-}" ]; then
              printf 'Rejected non-modification PR path: %s\t%s\t%s\n' "${status}" "${path}" "${extra:-}" >&2
              exit 1
            fi
            case "${HEAD_REF}" in
              bot/case-monitor-updates)
                if [[ ! "${path}" =~ ^inventory/(sources\.csv|sources-pending\.csv)$ ]] &&
                   [[ ! "${path}" =~ ^research/horizon-source-records/HOR-[0-9]{3}-source-development\.md$ ]] &&
                   [[ ! "${path}" =~ ^areas/[A-Z]+/research/[A-Z]+-[0-9]{3}-source-development\.md$ ]]; then
                  printf 'Rejected case-monitor path: %s\n' "${path}" >&2
                  exit 1
                fi
                ;;
              automation/presidential-directives-monitor)
                [ "${path}" = "inventory/presidential-directives.csv" ] || {
                  printf 'Rejected presidential-directives path: %s\n' "${path}" >&2
                  exit 1
                }
                ;;
              bot/source-checker-report)
                [ "${path}" = "framework/records/status/source-checker-report.md" ] || {
                  printf 'Rejected source-checker path: %s\n' "${path}" >&2
                  exit 1
                }
                ;;
              *)
                printf 'Rejected source-domain branch: %s\n' "${HEAD_REF}" >&2
                exit 1
                ;;
            esac
            mode="$(git ls-tree "${HEAD_SHA}" -- "${path}" | awk '{print $1}')"
            [ "${mode}" = "100644" ] || {
              printf 'Rejected non-regular watcher output: %s (%s)\n' "${path}" "${mode}" >&2
              exit 1
            }
          done < <(git diff --name-status "${BASE_SHA}...${HEAD_SHA}" --)
          [ "${changed}" -gt 0 ] || {
            echo "Accepted watcher pull request has no data delta." >&2
            exit 1
          }
          for trusted_path in \
            scripts/source_domain_events.py \
            scripts/publish_immutable_data_file.py; do
            git diff --quiet "${BASE_SHA}" "${MERGE_SHA}" -- "${trusted_path}" || {
              printf 'Accepted merge changed trusted execution code: %s\n' "${trusted_path}" >&2
              exit 1
            }
          done
          install -m 600 scripts/source_domain_events.py "${RUNNER_TEMP}/trusted-source-domain-events.py"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Fetch the immutable-event and current-main boundaries
        run: |
          git fetch --no-tags origin project-console-data
          git fetch --no-tags origin main

      - name: Verify the human acceptance boundary
        id: accepted-event
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "${PR_BODY}" > "${RUNNER_TEMP}/accepted-pr-body.md"
          python "${RUNNER_TEMP}/trusted-source-domain-events.py" accept \
            --pr-body-file "${RUNNER_TEMP}/accepted-pr-body.md" \
            --data-ref origin/project-console-data \
            --repository "${GITHUB_REPOSITORY}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --head-ref "${{ github.event.pull_request.head.ref }}" \
            --pull-request-number "${{ github.event.pull_request.number }}" \
            --pull-request-url "${{ github.event.pull_request.html_url }}" \
            --pr-head-revision "${{ github.event.pull_request.head.sha }}" \
            --merged "true" \
            --merged-at "${{ github.event.pull_request.merged_at }}" \
            --merged-by "${{ github.event.pull_request.merged_by.login }}" \
            --merged-by-type "${{ github.event.pull_request.merged_by.type }}" \
            --merge-commit "${{ github.event.pull_request.merge_commit_sha }}" \
            --output "${RUNNER_TEMP}/accepted-source-domain-event.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Preserve the accepted event on the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/publish_immutable_data_file.py
          --repository "${GITHUB_REPOSITORY}"
          --branch project-console-data
          --path "${{ steps.accepted-event.outputs.domain_event_path }}"
          < "${RUNNER_TEMP}/accepted-source-domain-event.json"

      - name: Preserve the accepted event as an Actions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accepted-source-domain-event-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-source-domain-event.json
          if-no-files-found: error
          retention-days: 90

      - name: Prepare the exact-once log-rendering branch
        id: log-branch
        env:
          EVENT_ID: ${{ steps.accepted-event.outputs.domain_event_id }}
        run: |
          set -euo pipefail
          branch="automation/source-event-log-$(printf '%s' "${EVENT_ID}" | tr '[:upper:]' '[:lower:]')"
          git config user.name "arrp-source-event-renderer[bot]"
          git config user.email "arrp-source-event-renderer[bot]@users.noreply.github.com"
          existing=false
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
            existing=true
          fi
          git checkout -B "${branch}" origin/main
          printf 'branch=%s\nexisting=%s\n' "${branch}" "${existing}" >> "${GITHUB_OUTPUT}"

      - name: Render accepted provenance exactly once
        id: render
        run: >-
          python "${RUNNER_TEMP}/trusted-source-domain-events.py" render
          --event "${RUNNER_TEMP}/accepted-source-domain-event.json"
          --source-log framework/records/sources/source-monitor-log.md
          --agent-log framework/records/automation/agent-audit-log.md
          --github-output "${GITHUB_OUTPUT}"

      - name: Verify or reserve the event-specific log branch
        id: log-branch-check
        env:
          LOG_BRANCH: ${{ steps.log-branch.outputs.branch }}
        run: |
          set -euo pipefail
          publish_required=false
          if [ "${{ steps.render.outputs.changed }}" = "true" ]; then
            if [ "${{ steps.log-branch.outputs.existing }}" = "true" ]; then
              python "${RUNNER_TEMP}/trusted-source-domain-events.py" verify-log-branch \
                --base-ref origin/main \
                --branch-ref "origin/${LOG_BRANCH}" \
                --source-log framework/records/sources/source-monitor-log.md \
                --agent-log framework/records/automation/agent-audit-log.md
            else
              publish_required=true
            fi
          fi
          printf 'publish_required=%s\n' "${publish_required}" >> "${GITHUB_OUTPUT}"

      - name: Commit and publish the log-rendering proposal
        id: publish-log
        if: >-
          steps.render.outputs.changed == 'true' &&
          steps.log-branch-check.outputs.publish_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_BRANCH: ${{ steps.log-branch.outputs.branch }}
        run: |
          gh auth setup-git
          git add framework/records/sources/source-monitor-log.md framework/records/automation/agent-audit-log.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^framework/records/(sources/source-monitor-log|automation/agent-audit-log)\.md$' || true)"
          if [ -n "${unexpected}" ]; then
            printf 'Unexpected log-renderer changes:\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git commit -m "Record accepted source-domain event ${{ steps.accepted-event.outputs.domain_event_id }}"
          git push --set-upstream origin "${LOG_BRANCH}"

      - name: Open or retain the owner-assigned log-rendering pull request
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_BRANCH: ${{ steps.log-branch.outputs.branch }}
          EVENT_ID: ${{ steps.accepted-event.outputs.domain_event_id }}
          ACCEPTED_PR: ${{ github.event.pull_request.html_url }}
        run: |
          pr_url="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${LOG_BRANCH}" --state open --json url --jq '.[0].url // empty')"
          body_file="${RUNNER_TEMP}/source-event-log-pr.md"
          printf '%s\n\n' "Renders accepted source-domain event \`${EVENT_ID}\` into the Source Monitor Log and shared Agent Audit Log." > "${body_file}"
          printf '%s\n' "- Acceptance boundary: ${ACCEPTED_PR}" >> "${body_file}"
          printf '%s\n' "- Structured event: \`project-console-data:${{ steps.accepted-event.outputs.domain_event_path }}\`" >> "${body_file}"
          printf '%s\n\n' "Each log contains a stable event marker; reruns are exact no-ops. This workflow does not merge the pull request." >> "${body_file}"
          if [ -z "${pr_url}" ]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${LOG_BRANCH}" \
              --title "Record accepted source-domain event ${EVENT_ID}" \
              --body-file "${body_file}" \
              --assignee Thorncrag
          else
            gh pr edit "${pr_url}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body-file "${body_file}" \
              --add-assignee Thorncrag
          fi
