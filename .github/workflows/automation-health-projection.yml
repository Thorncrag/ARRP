name: ARRP Automation Health Projection

on:
  workflow_run:
    workflows:
      - ARRP Run Coordinator Bot
    types:
      - completed
  repository_dispatch:
    types:
      - arrp-host-status
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

concurrency:
  group: arrp-automation-health-projection
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  cloud-health:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed projection runtime
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build the unconditional cloud health projection
        env:
          HEALTH_DIR: ${{ runner.temp }}/automation-health
        run: >-
          python3 scripts/build_automation_health_projection.py
          --mode workflow-run
          --event "${GITHUB_EVENT_PATH}"
          --output "${HEALTH_DIR}/automation-health.json"

      - name: Publish cloud health independently of chain success
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publish_project_console_progress.py
          --source "${RUNNER_TEMP}/automation-health"
          --repository Thorncrag/ARRP
          --branch project-console-data

  scheduled-heartbeat:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed projection runtime
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Read the latest coordinator runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_DIR: ${{ runner.temp }}/automation-health
        run: |
          mkdir -p "${HEALTH_DIR}"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${HEALTH_DIR}/scheduled-runs.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-coordinator-bot.yml/runs?event=schedule&per_page=1"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${HEALTH_DIR}/all-runs.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-coordinator-bot.yml/runs?per_page=1"

      - name: Build the missing-run and failure watchdog projection
        env:
          HEALTH_DIR: ${{ runner.temp }}/automation-health
        run: >-
          python3 scripts/build_automation_health_projection.py
          --mode watchdog
          --scheduled-runs "${HEALTH_DIR}/scheduled-runs.json"
          --all-runs "${HEALTH_DIR}/all-runs.json"
          --config .github/run-coordinator-bot.json
          --output "${HEALTH_DIR}/automation-health.json"

      - name: Publish the independent scheduled heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publish_project_console_progress.py
          --source "${RUNNER_TEMP}/automation-health"
          --repository Thorncrag/ARRP
          --branch project-console-data

  host-status:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed projection runtime
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate and minimize the trusted-host status event
        env:
          HOST_STATUS_DIR: ${{ runner.temp }}/host-status
        run: |
          mkdir -p "${HOST_STATUS_DIR}"
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          source = (event.get("client_payload") or {}).get("status")
          if not isinstance(source, dict):
              raise RuntimeError("host-status event has no status object")
          if source.get("schema_version") != 1:
              raise RuntimeError("host-status schema version is not supported")
          if source.get("projection_kind") != "host-run-status":
              raise RuntimeError("host-status projection kind is invalid")
          chain_id = str(source.get("chain_id") or "")
          if re.fullmatch(r"[A-Za-z0-9_.-]{1,160}", chain_id) is None:
              raise RuntimeError("host-status chain identity is invalid")
          status = str(source.get("host_status") or "")
          allowed_statuses = {
              "blocked",
              "completed",
              "failed",
              "human-review",
              "launch-deferred",
              "not-launched",
              "running",
              "usage-stopped",
          }
          if status not in allowed_statuses:
              raise RuntimeError("host-status value is invalid")
          updated_at = str(source.get("host_updated_at") or "")
          datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
          stage = str(source.get("stage") or "").strip()
          if not stage or len(stage) > 160:
              raise RuntimeError("host-status stage is invalid")
          action_items = source.get("host_action_items") or []
          if not isinstance(action_items, list) or len(action_items) > 20:
              raise RuntimeError("host-status incident inventory is invalid")
          allowed_item_fields = {
              "chain_id",
              "chain_ids",
              "created_at",
              "details",
              "failure_count",
              "first_chain_id",
              "first_seen",
              "id",
              "incident_fingerprint",
              "kind",
              "last_chain_id",
              "last_seen",
              "next_action",
              "occurrence_count",
              "owner",
              "resolved",
              "stage",
              "summary",
          }
          minimized_items = []
          for item in action_items:
              if not isinstance(item, dict) or not str(item.get("id") or ""):
                  raise RuntimeError("host-status incident row is invalid")
              minimized_items.append({
                  key: value
                  for key, value in item.items()
                  if key in allowed_item_fields
              })
          allowed_fields = {
              "chain_id",
              "cloud_status",
              "elim_runtime",
              "exit_code",
              "host_status",
              "host_updated_at",
              "message",
              "next_action",
              "projection_kind",
              "schema_version",
              "source_revision",
              "stage",
              "status",
              "updated_at",
              "usage_status",
              "work_item_id",
          }
          payload = {
              key: value
              for key, value in source.items()
              if key in allowed_fields
          }
          payload["host_action_items"] = minimized_items
          destination = Path(os.environ["HOST_STATUS_DIR"], "host-status.json")
          destination.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Publish host status without running Elim or rebuilding the Console
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publish_project_console_progress.py
          --source "${RUNNER_TEMP}/host-status"
          --repository Thorncrag/ARRP
          --branch project-console-data
