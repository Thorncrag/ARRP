name: Assemble public-language report

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: agent/public-language-report

      - name: Assemble and verify PDF
        shell: bash
        run: |
          set -euo pipefail
          target="framework/reports/governance/asd-ste100-public-language-proposal-2026-07-31.pdf"
          mkdir -p "$(dirname "$target")"
          cat .github/report-parts/public-language/part-*.b64 \
            | tr -d '\r\n' \
            | base64 --decode > "$target"
          test "$(sha256sum "$target" | awk '{print $1}')" = \
            "2082487e7a38feb25eeb2ec893a6740b0e5446688502e4ef49f6e5455de984d2"
          test "$(head -c 5 "$target")" = "%PDF-"

      - name: Commit report and remove transient assembly files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/report-parts/public-language
          rm -f .github/workflows/assemble-public-language-report.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add public-language proposal review report"
          git push origin HEAD:agent/public-language-report
